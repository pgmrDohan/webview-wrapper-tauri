name: "Build: Android & iOS"
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version tag (e.g., v1.0.0)"
        required: true
        type: string
        default: "v1.0.0"
      build_android:
        description: "Build Android APK"
        type: boolean
        default: true
      build_ios:
        description: "Build iOS IPA"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    name: Generate Project Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Validate config
        run: python scripts/validate_config.py

      - name: Generate project files
        run: python scripts/generate.py

      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: generated-src-tauri
          path: |
            src-tauri/Cargo.toml
            src-tauri/src/lib.rs
            src-tauri/tauri.conf.json
            src-tauri/capabilities/default.json
            src-tauri/Info.ios.plist
            src-tauri/gen/apple/webview-wrapper-tauri_iOS/webview-wrapper-tauri_iOS.entitlements
            src-tauri/gen/android/app/src/main/AndroidManifest.xml

  build-android:
    name: Build Android
    needs: generate
    if: inputs.build_android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-src-tauri
          path: src-tauri/

      - name: Set up Python & generate
        run: |
          pip install -r scripts/requirements.txt
          python scripts/generate.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo tauri android build --apk

      - name: Sign APK
        if: env.HAS_ANDROID_SIGNING == 'true'
        env:
          HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ fromJson(needs.generate.outputs || '{}').android_key_alias || 'release' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Decode keystore
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          
          # Find the unsigned APK
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          
          if [ -n "$APK_PATH" ]; then
            # Sign with apksigner
            ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:$KEYSTORE_PASSWORD \
              --ks-key-alias $KEY_ALIAS \
              --key-pass pass:$KEY_PASSWORD \
              "$APK_PATH"
          fi
          
          # Clean up keystore
          rm -f release.keystore

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  build-ios:
    name: Build iOS
    needs: generate
    if: inputs.build_ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          name: generated-src-tauri
          path: src-tauri/

      - name: Set up Python & generate
        run: |
          pip install -r scripts/requirements.txt
          python scripts/generate.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios,aarch64-apple-ios-sim

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Setup iOS signing
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          HAS_IOS_SIGNING: ${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Install provisioning profile
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS
        run: |
          cargo tauri ios build

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: src-tauri/gen/apple/build/**/*.ipa

  release:
    name: Create Release
    needs: [build-android, build-ios]
    if: always() && (needs.build-android.result == 'success' || needs.build-ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android/

      - name: Download iOS IPA
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/ios/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version_tag }}
          name: "Release ${{ inputs.version_tag }}"
          body: |
            ## Release ${{ inputs.version_tag }}
            
            ### Artifacts
            - Android APK: ${{ needs.build-android.result == 'success' && '✅' || '❌ Not built' }}
            - iOS IPA: ${{ needs.build-ios.result == 'success' && '✅' || '❌ Not built' }}
            
            ### Configuration
            Built with the settings from `config/` directory.
          files: |
            artifacts/**/*.apk
            artifacts/**/*.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
